[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-companion"
version = "0.1.0"
description = "Research-paper Q&A, section summaries, and paper comparison with cited answers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "numpy>=1.24",
    "PyMuPDF>=1.23",
    "gradio>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["research_companion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
